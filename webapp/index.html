<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColabMapsApp v2.0 | Google Maps Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app-container">
        <!-- Floating Search Overlay -->
        <div id="search-overlay" class="glass-panel">
            <div class="input-group">
                <label for="origin-input">Origin</label>
                <input type="text" id="origin-input" placeholder="Enter Origin Address..." aria-label="Origin">
            </div>
            <div class="input-group">
                <label for="destination-input">Destination</label>
                <input type="text" id="destination-input" placeholder="Enter Final Destination..." aria-label="Destination">
            </div>
            <div class="input-group">
                <label for="bulkInput">Bulk Waypoints</label>
                <textarea id="bulkInput" placeholder="Enter multiple addresses (later implementation)" rows="2"></textarea>
            </div>
            <button id="route-btn" class="primary-btn">Calculate Route</button>
        </div>

        <!-- Info Sidebar -->
        <div id="info-sidebar" class="glass-panel hidden">
            <div class="sidebar-header">
                <h2>Route Details</h2>
                <button id="close-sidebar" class="icon-btn">&times;</button>
            </div>
            <div id="route-info">
                <p>Start typing to search for locations...</p>
            </div>
        </div>

        <!-- Map Container -->
        <div id="map"></div>

        <!-- Floating Controls -->
        <div id="map-controls">
            <button id="locate-btn" class="glass-panel icon-btn" title="Locate Me">
                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
            </button>
        </div>
    </div>

    <!-- Google Maps JS API will be loaded dynamically after fetching the key -->
    <script src="script.js"></script>
</body>
</html>
