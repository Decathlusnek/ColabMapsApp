
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColabMapsApp - Advanced Map Integration</title>
    <link rel="stylesheet" href="style.css">
    <!-- Define global variables and initMap function first -->
    <script>
        let map;
        let geocoder;
        let directionsService;
        let directionsRenderer;
        let markers = []; // All markers go here
        let currentLocationMarkerId = null; // To track the current location marker's ID
        let nextMarkerId = 0; // Simple ID generator for markers

        function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: 34.0522, lng: -118.2437 },
                zoom: 10,
            });
            geocoder = new google.maps.Geocoder();
            directionsService = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer();
            directionsRenderer.setMap(map);
            console.log('Google Map and Services initialized.');
            // Dispatch a custom event to notify script.js that map is ready
            document.dispatchEvent(new CustomEvent('mapinit'));
        }
    </script>
    <!-- Load Google Maps API script. It will call initMap when ready. -->
    <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBQQqpwdIgeck9NPJ-o-8dLdsBhI2cXRPE&callback=initMap&loading=async"></script>
</head>
<body>
    <h1>ColabMapsApp - Google Maps</h1>
    <div id="map"></div>
    <div class="controls">
        <h2>Route Planning</h2>
        <label for="originAddress">Origin Address (Required):</label>
        <input type="text" id="originAddress" placeholder="Enter origin address">
        <button id="currentLocationBtn">Use Current Location</button>
        <br>
        <label for="destinationAddress">Destination Address (Optional):</label>
        <input type="text" id="destinationAddress" placeholder="Enter destination address">
        <br>
        <div class="avoidance-options">
            <input type="checkbox" id="avoidHighways"> <label for="avoidHighways">Avoid Highways</label>
            <input type="checkbox" id="avoidTolls"> <label for="avoidTolls">Avoid Tolls</label>
            <input type="checkbox" id="avoidFerries"> <label for="avoidFerries">Avoid Ferries</label>
        </div>
        <button id="getDirectionsBtn">Get Directions</button>

        <hr>

        <h2>Bulk Address Resolution</h2>
        <textarea id="bulkAddressInput" placeholder="Enter addresses (one per line or separated by semicolons)"></textarea>
        <button id="resolveBulkBtn">Resolve Bulk Addresses</button>
        <br>
        <label for="resolvedAddressesOutput">Resolved Bulk Addresses:</label>
        <textarea id="resolvedAddressesOutput" readonly placeholder="Resolved addresses will appear here..."></textarea>

        <div id="directionsPanel"></div>
    </div>
    <!-- Load our application specific script with defer to ensure DOM is ready -->
    <script src="script.js" defer></script>
</body>
</html>
